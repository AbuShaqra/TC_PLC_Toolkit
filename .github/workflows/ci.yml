name: CI

on:
  # Pull requests only, deliberately: a `push` trigger re-ran exactly what the PR had already proved,
  # so every change cost two runs. PRs into `dev` run CI automatically too (added 2026-08-26, by
  # decision — it replaced the manual-only dev gate); direct pushes to `dev` still trigger nothing,
  # so ci-manual.yml remains the way to test an arbitrary ref by hand (it calls this workflow, see
  # workflow_call).
  pull_request:
    branches: [main, dev]
  # Lets ci-manual.yml reuse these jobs without a second copy of them. Not a trigger on its own:
  # nothing runs unless a caller workflow is dispatched.
  workflow_call:
    inputs:
      ref:
        description: 'Branch, tag or SHA to check out and test (empty = the ref the event is for)'
        type: string
        required: false
        default: ''

# This workflow only reads the repo — no publishing, no issue/PR writes.
permissions:
  contents: read

# A new push to the same branch/PR supersedes the previous run; nothing here is worth finishing twice.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # TwinCAT (and the DTE-driven library-definitions feature) is Windows-only, and the LSP's
    # URI<->path handling is Windows-native, so CI runs on the platform users actually run on.
    runs-on: windows-latest
    steps:
      # On a pull request `inputs` is empty, so this is the event's own ref (the PR merge commit) —
      # the default. Called from ci-manual.yml it is whatever ref was asked for, `dev` by default.
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Type-check only (no emit) — a safety net over the JSDoc; the extension ships plain JS.
      - name: Type-check
        run: npm run typecheck

      # sample/ is wholly synthetic and COMMITTED, so the diagnostics ratchet and the live-path
      # guard run here like every other suite. REQUIRE_FULL_SUITE=1 makes that a hard gate: a run
      # whose load-bearing gates skipped (REDUCED coverage) fails instead of passing quietly, so a
      # green badge always means the ratchet actually held.
      - name: Test
        run: npm test
        env:
          REQUIRE_FULL_SUITE: '1'

      # Packaging is otherwise only exercised by hand at release time, where a broken manifest,
      # .vscodeignore or engines constraint would surface far too late. Building the VSIX here keeps
      # that failure on the PR instead. The flags match the documented release command.
      - name: Package (VSIX build check)
        run: npx @vscode/vsce package --allow-missing-repository --skip-license

  # The extension does not run on the CI default Node — it runs on whatever Node VS Code bundles.
  # `engines.vscode` is ^1.66.0, and VS Code 1.66 ships Electron 17 (Node 16), so the suite has to
  # keep working there or that support claim is fiction. 20 covers a mid LTS; the current runtime is
  # already covered by `build` above.
  #
  # Tests only, deliberately: the type-check (TypeScript 7) and vsce both require a modern Node, so
  # running them here would fail on tooling constraints rather than on anything about the product.
  runtime-compat:
    runs-on: windows-latest
    strategy:
      # Report every version's result — knowing 16 fails while 20 passes is the whole point.
      fail-fast: false
      matrix:
        node-version: ['16', '20']
    name: Test on Node ${{ matrix.node-version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test
