name: Release

# Manual only. Builds the VSIX from the selected ref and publishes it as a GitHub release tagged
# v<package.json version>. Nothing is ever overwritten: if that tag or release already exists the run
# fails before building — bump `version` in package.json (and merge it) to release again.
#
# Run it from the Actions tab (or `gh workflow run release.yml`), normally against main.
#
# Then the `publish` job (publish.yml) uploads that same VSIX to the VS Code Marketplace and Open VSX,
# each only when its token secret (VSCE_PAT / OVSX_PAT) is set; a draft or pre-release is not published
# there. A failed upload fails the run but leaves the GitHub release in place: retry it with "Re-run
# failed jobs" on this run, or run Publish by hand with the tag. Re-running all of Release would stop at
# the overwrite check below, by design.
on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark the GitHub release as a pre-release'
        type: boolean
        default: false
      draft:
        description: 'Create the release as a draft, so the notes can be edited before it goes public'
        type: boolean
        default: false

# The tag, the release and the attached VSIX are all writes to the repo's contents; nothing else.
# (The publish job only reads; publish.yml narrows itself to contents: read.)
permissions:
  contents: write

# Two releases racing would fight over the same tag; queue them instead of cancelling.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    # Same platform as CI: TwinCAT is Windows-only and the LSP's URI<->path handling is Windows-native.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Read the version from package.json
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "vsix=twincat-plc-toolkit-$version.vsix" >> "$GITHUB_OUTPUT"
          echo "Releasing $version as tag v$version"

      # Fail before spending a build on it. Both checks are needed: a tag can exist without a
      # release (pushed by hand), and a draft release can exist without its tag.
      - name: Refuse to overwrite an existing tag or release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::error::Tag $TAG already exists. Bump \"version\" in package.json to release again."
            exit 1
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Bump \"version\" in package.json to release again."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The same gates CI runs on every push. A release must never ship what CI would have rejected.
      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      # The command matches the documented release command in DEVELOPMENT.md, with vsce pinned to the
      # version publish.yml publishes with. No flags: package.json names the repository (vsce rewrites the
      # README's relative links and images against it) and LICENSE is found and shipped. `npm ci`
      # installs exactly package-lock.json, so there is no extraneous package for vsce to sweep up (the
      # `npm prune` step a local build needs).
      - name: Package the VSIX
        run: npx --yes @vscode/vsce@4.1.1 package -o "${{ steps.version.outputs.vsix }}"

      # Also kept as a run artifact, so the exact bytes that were released stay downloadable from the
      # run even if the release is later edited or deleted.
      - name: Upload the VSIX as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.vsix }}
          path: ${{ steps.version.outputs.vsix }}
          if-no-files-found: error

      # `gh release create` creates the tag at --target when it does not exist yet, so the tag always
      # points at exactly the commit that was built. Notes are generated from the PRs/commits since the
      # previous tag (or all of them, for the first release).
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          VSIX: ${{ steps.version.outputs.vsix }}
          PRERELEASE: ${{ inputs.prerelease }}
          DRAFT: ${{ inputs.draft }}
        run: |
          flags=()
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          [ "$DRAFT" = "true" ] && flags+=(--draft)
          # The version's CHANGELOG.md section (from its "## <version>" heading to the next "## ") leads
          # the notes; GitHub's generated list of PRs follows it. No section: generated notes only.
          awk -v v="$VERSION" '$0 ~ "^## " v "( |$)" {f=1; next} f && /^## / {exit} f' CHANGELOG.md > release-notes.md || true
          if [ -s release-notes.md ]; then flags+=(--notes-file release-notes.md); else echo "::warning::No CHANGELOG.md section for $VERSION"; fi
          gh release create "$TAG" "$VSIX" \
            --target "$GITHUB_SHA" \
            --title "TC Toolkit $VERSION" \
            --generate-notes \
            "${flags[@]}"
          echo "Released $TAG from $GITHUB_SHA with $VSIX attached"

  # The marketplaces get the VSIX now attached to the release (publish.yml downloads it), so this job can
  # be re-run on its own. Skipped for a draft (its notes are still being edited) and a pre-release (the
  # marketplaces would list it as the current version); publish those later with the Publish workflow.
  publish:
    needs: release
    if: ${{ !inputs.draft && !inputs.prerelease }}
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
